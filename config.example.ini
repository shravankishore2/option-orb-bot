# Copy to config.ini (git-ignored) and fill in. Never commit config.ini.
# Environment variables override these: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
# ORBITAL_DHAN_TOKEN_FILE, DHAN_ACCESS_TOKEN, DHAN_CLIENT_ID.

[DEFAULT]
# Telegram bot from @BotFather, and the chat that receives the signals
telegram_token = <bot token>
telegram_chat_id = <chat id>

[dhan]
# --- Option A (the VM): read the token another service keeps fresh --------
# ORBITAL never logs in to Dhan. It reads this JSON file
# ({"access_token", "client_id", "expiry"}), waits while it is being
# refreshed, and picks up the new token after a 401.
token_file = ~/newsalert/data/dhan_token.json

# --- Option B (local research): a static token from web.dhan.co -----------
# Delete token_file above to use these. Tokens expire about daily.
# dhan_client_id = <client id>
# dhan_access_token = <access token>

# --- Sharing the account's 5 req/s data-API limit -------------------------
# Requests per second for ORBITAL (default 4 when ORBITAL is alone).
rate_per_sec = 3
# Seconds of each minute with no ORBITAL requests (wraps round :00), left
# free for the other service's once-a-minute batched call. Omit when alone.
quiet_seconds = 57-4
