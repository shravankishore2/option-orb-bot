<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ORBITAL · Log in</title>
    <script>
      // Same as QuantRadar: light by default whatever the OS prefers.
      try { document.documentElement.dataset.theme = localStorage.getItem('qr-theme') === 'dark' ? 'dark' : 'light' }
      catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
    <style>
      /* Login styling copied from QuantRadar (web/src/index.css) so both dashboards match. */
      :root {
        color-scheme: light;
        --bg: #ffffff; --surface-1: #fcfcfb; --surface-2: #ffffff;
        --border: #e3e2de; --border-strong: #7c7a73;
        --text-primary: #1d1d1f; --text-secondary: #52514e; --text-muted: #5f5e59;
        --accent: #2a78d6; --accent-ink: #ffffff; --accent-strong: #1c5cab;
        --critical-ink: #b42323; --focus: #2a78d6;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.05);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #121211; --surface-1: #1a1a19; --surface-2: #222220;
          --border: #2f2f2c; --border-strong: #7a7870;
          --text-primary: #ecebe6; --text-secondary: #c3c2b7; --text-muted: #9a998f;
          --accent: #3987e5; --critical-ink: #f07575; --shadow: none;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #121211; --surface-1: #1a1a19; --surface-2: #222220;
        --border: #2f2f2c; --border-strong: #7a7870;
        --text-primary: #ecebe6; --text-secondary: #c3c2b7; --text-muted: #9a998f;
        --accent: #3987e5; --critical-ink: #f07575; --shadow: none;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text-primary); }
      button, input, select { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .btn {
        border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: 8px;
        padding: 6px 12px; cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:hover { border-color: var(--text-muted); }
      .btn.primary { background: var(--accent-strong); color: var(--accent-ink); border-color: var(--accent-strong); }
      .btn:disabled { cursor: default; }
      .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
      .login form { width: min(360px, 100%); background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
      .login h1 { margin: 0; font-size: 20px; }
      .login p { margin: 0; font-size: 13px; color: var(--text-secondary); }
      .login input { border: 1px solid var(--border-strong); background: var(--surface-2); border-radius: 8px; padding: 9px 12px; }
      .error { color: var(--critical-ink); font-size: 14px; }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    </style>
</head>
<body>
<div class="login">
    <form id="login" method="post" action="{{ url_for('login_form') }}">
        <h1>ORBITAL</h1>
        <p>Private dashboard. Dhan's market data is licensed for personal use only, so it needs a password.</p>
        <label class="sr-only" for="pw">Password</label>
        <input id="pw" name="password" type="password" autocomplete="current-password" autofocus placeholder="Password">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="error" role="alert" id="error"{% if not error %} hidden{% endif %}>{{ error }}</div>
        <button class="btn primary" id="submit" {% if not error %}disabled{% endif %}>Log in</button>
    </form>
</div>
<script>
  // Mirrors QuantRadar's Login component: JSON POST to /api/login, 204 = in.
  // Without JavaScript the form still posts to /login.
  const form = document.getElementById('login'), pw = document.getElementById('pw'),
        btn = document.getElementById('submit'), err = document.getElementById('error');
  pw.addEventListener('input', () => { btn.disabled = !pw.value });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Checking…'; err.hidden = true;
    let message = 'Wrong password.';
    try {
      const r = await fetch('{{ url_for("api_login") }}', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }),
      });
      if (r.status === 204) { location.replace(form.elements.next.value || '/'); return; }
      const body = await r.json().catch(() => ({}));
      if (r.status === 429) message = `Too many attempts. Try again in ${body.retry_after ?? 60} s.`;
    } catch (_) { message = 'Could not reach the server.'; }
    err.textContent = message; err.hidden = false;
    btn.textContent = 'Log in'; btn.disabled = !pw.value;
  });
</script>
</body>
</html>
